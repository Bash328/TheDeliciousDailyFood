<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Manager — The Delicious Daily</title>
  <!-- Netlify Identity is what lets someone log in here with just an email
       and password, no GitHub account. Git Gateway, enabled on the Netlify
       side, is what then lets Decap read and write this repo on their behalf
       once they're signed in. One-time setup:
       docs/COLLABORATOR-AND-SUBMISSIONS-SETUP.md

       Decap loads this same widget itself for a git-gateway backend; loading
       it here first is what makes an invite or password-reset link (which
       arrives as #invite_token=... in the URL) open its "set your password"
       dialog reliably, before Decap has finished booting. Deliberately no
       extra JS beyond this: Decap draws its own "Login with Netlify Identity"
       screen, and hand-rolled open()/redirect-on-login handlers on the admin
       page itself just fight with it. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="../quickpaste-widget.js"></script>
  <script src="../theme.js"></script>
</body>
</html>
