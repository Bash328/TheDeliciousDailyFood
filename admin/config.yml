# The main content manager, at https://admin.thedeliciousdaily.com — signs in
# with a GitHub account through the OAuth relay worker in ../oauth-worker.
# This folder is deployed on its own as a Cloudflare Worker (see docs/CMS-GUIDE.md);
# the public site's build leaves it out.
backend:
  name: github
  repo: Bash328/TheDeliciousDailyFood
  branch: main
  base_url: "https://decap-oauth.cwakiku.workers.dev"

logo_url: "https://thedeliciousdaily.com/images/logo-mark.png"
site_url: "https://thedeliciousdaily.com"
display_url: "https://thedeliciousdaily.com"

media_folder: "images"
public_folder: "/images"

# Our own photo library (admin/photo-library.js) instead of Decap's built-in one:
# two-column grid, every button visible, and uploads resized to one standard size.
media_library:
  name: dd-photos
  config:
    repo: Bash328/TheDeliciousDailyFood
    branch: main
    folder: images
    public_folder: /images

publish_mode: simple

# No live preview pane. Decap's preview would show the raw fields in an unstyled
# box (the site's stylesheet isn't loaded here) and, on a phone, squeezes the
# form into half the screen. The editor is a single column instead.
editor:
  preview: false

# --- collections block ------------------------------------------------------
# Two views onto the same _recipes folder: everything, and just the ones that
# came in through the public form. The second is a filter, not a separate
# place — a submitted recipe is an ordinary recipe file, so publishing it is
# the same job as publishing any other.
#
# Field order is the order you fill a recipe in: what it is, a photo, the recipe
# itself, then the fiddly details (web address, date, credit, draft) at the end.
# Decap adds "(optional)" to the label of any field marked required: false, so
# labels don't say it themselves.
collections:
  - name: "recipes"
    label: "Recipes"
    folder: "_recipes"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} · {{category}}"
    sortable_fields: ["date", "title", "category"]
    view_filters:
      - { label: "Drafts (not live yet)", field: "draft", pattern: true }
    view_groups:
      - { label: "Category", field: "category" }
    fields: &recipe_fields
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Photo", name: "image", widget: "image", required: false, hint: "Leave blank to use a plain placeholder until you have a photo." }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Dinner", "Lunch", "Dessert", "Breakfast", "Soup"]
      - { label: "Short description", name: "description", widget: "text", hint: "Used as the card blurb, the page intro, and the search/Pinterest description. 1-2 sentences." }
      - label: "Recipe"
        name: "recipeContent"
        widget: "quickpaste"
        default: { servingsUnit: "Servings", ingredients: [], steps: [] }
      - { label: "Note", name: "note", widget: "text", required: false, hint: "A tip shown at the end of the method." }
      - { label: "Tag", name: "tag", widget: "string", required: false, hint: "A short word shown next to the category, e.g. One Skillet or Weeknight." }
      - { label: "Cuisine", name: "cuisine", widget: "string", required: false, hint: "e.g. Italian, Indian, Thai. Used in the recipe's search-result data. Leave blank when it isn't a clear fit; a wrong cuisine is worse than none." }
      - { label: "Publish date", name: "date", widget: "datetime", required: false, hint: "Leave this blank for a new recipe: today's date is filled in when you save." }
      # No slug field to fill in: a recipe's web address comes from its title
      # (the file name), e.g. "Lemon Blueberry Muffins" -> /recipes/lemon-blueberry-muffins/.
      # Older recipes that pin an address with `slug:` keep it; this hidden field
      # just stops the CMS dropping it when one of them is saved.
      - { label: "URL slug", name: "slug", widget: "hidden", required: false }
      - { label: "Credit name", name: "creditName", widget: "string", required: false, hint: "Shown on the recipe as who sent it in. Filled in from the submission form; clear it to publish without a credit." }
      - { label: "Credit Instagram handle", name: "creditInstagram", widget: "string", required: false, hint: "Just the handle, no @, e.g. jamieoliver. Linked from the credit line (nofollow). Clear it to drop the link." }
      - { label: "Draft — keep off the live site", name: "draft", widget: "boolean", default: false, required: false, hint: "On = hidden from the homepage. Recipes sent in through the public form arrive with this on; turn it off when you're happy with the recipe, then publish." }
      - { label: "Came in through the submission form", name: "submitted", widget: "boolean", default: false, required: false, hint: "Set automatically for recipes sent in at /submit-recipe/; it's what puts them in the Submitted list. Turn it off when you've finished with one to clear it from that list." }

  - name: "submitted"
    label: "Submitted (from the public form)"
    folder: "_recipes"
    create: false
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} · {{category}}"
    filter: { field: "submitted", value: true }
    fields: *recipe_fields
